        <line x1="210" y1="338" x2="292" y2="265" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
        <polygon points="292,265 282,268 288,275" fill="#0f172a" />
        <polygon points="210,338 218,335 212,328" fill="#0f172a" />
        <path d="M 180,395 C 215,385 240,392 250,400 C 260,392 285,385 320,395 L 325,406 L 250,422 L 175,406 Z" fill="#94a3b8" stroke="#0f172a" stroke-width="2" />
        <path d="M 180,390 C 215,380 240,388 250,396 C 260,388 285,380 320,390 L 322,402 C 285,392 260,400 250,408 C 240,400 215,392 178,402 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
        <text x="250" y="380" font-family="'Impact', 'Arial Black', -apple-system, sans-serif" font-size="24" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="3">AMOR</text>
        <text font-family="'Arial Black', -apple-system, sans-serif" font-size="14" font-weight="900" fill="#0f172a" letter-spacing="2">
