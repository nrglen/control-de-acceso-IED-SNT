          <ellipse cx="272" cy="142" rx="8" ry="14" transform="rotate(-15 272 142)" fill="#22c55e" />
          <ellipse cx="285" cy="130" rx="8" ry="14" transform="rotate(10 285 130)" fill="#16a34a" />

