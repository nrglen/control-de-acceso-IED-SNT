          <ellipse cx="435" cy="180" rx="8" ry="14" transform="rotate(40 435 180)" fill="#22c55e" />
          <ellipse cx="435" cy="160" rx="8" ry="14" transform="rotate(30 435 160)" fill="#16a34a" />
          <ellipse cx="428" cy="142" rx="8" ry="14" transform="rotate(15 428 142)" fill="#22c55e" />
          <ellipse cx="415" cy="130" rx="8" ry="14" transform="rotate(-10 415 130)" fill="#16a34a" />
