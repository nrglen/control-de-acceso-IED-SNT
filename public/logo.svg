        <path d="M 250,260 C 242,275 258,280 250,290 C 260,282 258,270 250,260 Z" fill="#facc15" stroke="#e11d2a" stroke-width="2" />
        <path d="M 250,295 C 235,275 218,285 222,305 C 226,325 245,340 250,350 C 255,340 274,325 278,305 C 282,285 265,275 250,295 Z" fill="#e11d2a" stroke="#ffffff" stroke-width="3.5" />
