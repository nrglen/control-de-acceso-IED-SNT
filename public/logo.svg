        <path d="M 350,90 C 340,105 348,120 338,135 C 352,130 358,115 356,105 Z" fill="#facc15" />
        
        <path d="M 330,145 L 370,145 L 362,165 L 338,165 Z" fill="#f97316" stroke="#0f172a" stroke-width="2.5" />
        <path d="M 350,165 L 342,225 L 346,232 L 354,232 L 358,225 L 350,165 Z" fill="#f97316" stroke="#0f172a" stroke-width="2.5" />
        <path d="M 340,175 Q 355,185 345,200 Q 360,210 348,225" stroke="#e11d2a" stroke-width="3" fill="none" />
      </g>

