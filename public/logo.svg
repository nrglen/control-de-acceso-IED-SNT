    </clipPath>
    <clipPath id="upperRightClip">
      <rect x="250" y="50" width="200" height="195" />
    </clipPath>
    <clipPath id="lowerHalfClip">
      <rect x="50" y="245" width="400" height="210" />
    </clipPath>
    
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="60%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="seaBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
