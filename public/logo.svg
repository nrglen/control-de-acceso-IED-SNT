        <path d="M 70,218 L 70,210 A 6 6 0 0 1 82 210 M 125,188 L 125,180 A 6 6 0 0 1 137 180 M 175,160 L 175,152 A 6 6 0 0 1 187 152" stroke="#0f172a" stroke-width="2" fill="none" />
